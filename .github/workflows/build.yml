name: build-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cu124
            dockerfile: docker/Dockerfile
          - tag: hy3d21
            dockerfile: hy3d21/Dockerfile
          - tag: trellis2
            dockerfile: trellis2/Dockerfile
          - tag: pixal3d
            dockerfile: pixal3d/Dockerfile
    steps:
      - name: Free disk space (big ML images need room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every build gets an IMMUTABLE tag (<lane>-<utc date>-<short sha>) next to the floating
      # lane tag, so an endpoint can be pinned to one exact build and a rollback is a tag name,
      # not an archaeology of digests. The floating tag keeps moving for the bake-off lanes.
      - name: Immutable tag
        id: meta
        run: echo "immutable=${{ matrix.tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hy3d-gen:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/hy3d-gen:${{ steps.meta.outputs.immutable }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Report
        run: |
          echo "pushed ghcr.io/${{ github.repository_owner }}/hy3d-gen:${{ matrix.tag }}"
          echo "pushed ghcr.io/${{ github.repository_owner }}/hy3d-gen:${{ steps.meta.outputs.immutable }}  (immutable)"
